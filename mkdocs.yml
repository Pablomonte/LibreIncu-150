site_name: LibreIncu-150
site_description: Manual de Montaje - Incubadora Libreincu 150 v1
site_url: https://pablomonte.github.io/LibreIncu-150/
docs_dir: docs
exclude_docs: |
  img/piezas/manifiesto.md

theme:
  name: material
  language: es
  icon:
    logo: material/egg
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest

nav:
  - Manual de montaje: index.md
  - Descargar PDF: manual_libreincu_150.pdf

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - .
        - Rediseno
      check_paths: true

plugins:
  - search
